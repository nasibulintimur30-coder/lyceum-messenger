# Конфигурация деплоя на Netlify.
# Фронтенд — статические файлы из папки web/, сборка не нужна.
# Бэкенд (server/) хостится отдельно — см. README, раздел «Деплой».

[build]
  publish = "web"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
