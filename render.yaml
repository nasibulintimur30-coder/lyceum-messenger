# Блюпринт для Render.com: https://render.com/docs/blueprint-spec
#
# Подключение: New → Blueprint → указать репозиторий с этим файлом.
# Render соберёт Docker-образ и выдаст публичный адрес вида
# https://lyceum-messenger.onrender.com — его нужно вписать в apiBase
# в файле web/config.js.
#
# Карта для оплаты не нужна: тариф free работает без неё.
#
# ВАЖНО про данные: на free-тарифе диск сервера обнуляется при каждом
# перезапуске, поэтому база и картинки хранятся в облаке Turso
# (переменные TURSO_URL / TURSO_AUTH_TOKEN ниже). Без них сообщения
# пропадут после перезапуска.

services:
  - type: web
    name: lyceum-messenger
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      # Домен фронтенда на Netlify — впишите свой
      - key: CORS_ORIGIN
        value: https://lyceum-messenger.netlify.app
      # Облачная база Turso: создайте её на https://turso.tech
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
