<!doctype html>
<html lang="ru" data-accent="neon" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lyceum Messenger</title>
    <meta name="description" content="Lyceum Messenger — быстрый мессенджер с обменом сообщениями в реальном времени" />
    <meta name="theme-color" content="#06070c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <!-- Предупреждение о недоступном бэкенде (видно на любом экране) -->
    <div id="backend-warning" class="warning" hidden>
      <strong>Бэкенд не подключён</strong>
      <span id="backend-warning-text"></span>
    </div>

    <!-- ============================ Экран входа ============================ -->
    <section id="screen-auth" class="screen screen--auth">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="auth-logo" aria-hidden="true">✦</div>
          <h1>Lyceum Messenger</h1>
          <p id="auth-subtitle">Войдите, чтобы продолжить общение</p>
        </div>

        <form id="auth-form" class="auth-form" autocomplete="on" novalidate>
          <label class="field" id="field-display">
            <span class="field__label">Отображаемое имя</span>
            <input
              id="auth-display"
              class="field__input"
              type="text"
              name="displayName"
              maxlength="32"
              placeholder="Как вас зовут?"
              autocomplete="nickname"
            />
          </label>

          <label class="field">
            <span class="field__label">Телефон</span>
            <input
              id="auth-phone"
              class="field__input"
              type="tel"
              name="phone"
              inputmode="tel"
              autocomplete="tel"
              placeholder="+7 (999) 123-45-67"
              maxlength="18"
              required
            />
          </label>

          <label class="field">
            <span class="field__label">Пароль</span>
            <input
              id="auth-password"
              class="field__input"
              type="password"
              name="password"
              placeholder="Минимум 6 символов"
              autocomplete="current-password"
              required
            />
          </label>

          <p id="auth-error" class="auth-error" role="alert" hidden></p>

          <button id="auth-submit" class="btn btn--primary btn--block" type="submit">Войти</button>
          <button id="auth-toggle" class="btn btn--ghost btn--block" type="button">
            Нет аккаунта? Создать
          </button>
        </form>
      </div>
    </section>

    <!-- ============================== Приложение ============================== -->
    <main id="screen-app" class="screen screen--app" hidden>
      <!-- Боковая панель -->
      <aside id="sidebar" class="sidebar">
        <header class="sidebar__head">
          <button id="me-button" class="avatar avatar--lg" type="button" title="Профиль">
            <span id="me-initials">?</span>
          </button>
          <div class="sidebar__identity">
            <strong id="me-name">—</strong>
            <span id="me-username" class="muted">—</span>
          </div>
          <div class="sidebar__actions">
            <button id="action-settings" class="icon-btn" type="button" title="Настройки">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0 .33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
                />
              </svg>
            </button>
            <button id="action-new-group" class="icon-btn" type="button" title="Создать группу">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
            </button>
            <button id="action-new-chat" class="icon-btn" type="button" title="Новый чат">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z" />
              </svg>
            </button>
            <button id="action-logout" class="icon-btn" type="button" title="Выйти">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.36 6.64a9 9 0 1 1-12.72 0" />
                <path d="M12 2v10" />
              </svg>
            </button>
          </div>
        </header>

        <div class="sidebar__search">
          <input
            id="search-input"
            class="field__input"
            type="search"
            placeholder="Поиск чатов и людей"
            autocomplete="off"
          />
        </div>

        <nav class="tabs" role="tablist">
          <button class="tab is-active" type="button" data-tab="chats" role="tab">Чаты</button>
          <button class="tab" type="button" data-tab="contacts" role="tab">Контакты</button>
        </nav>

        <div id="list-chats" class="list" role="tabpanel"></div>
        <div id="list-contacts" class="list" role="tabpanel" hidden></div>
        <div id="list-search" class="list" role="tabpanel" hidden></div>
      </aside>

      <!-- Область чата -->
      <section id="chat" class="chat" hidden>
        <header class="chat__head">
          <button id="chat-back" class="icon-btn chat__back" type="button" title="Назад">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12H5" />
              <path d="m12 19-7-7 7-7" />
            </svg>
          </button>
          <button id="chat-avatar" class="avatar" type="button"><span id="chat-initials">?</span></button>
          <div class="chat__identity">
            <strong id="chat-title">—</strong>
            <span id="chat-subtitle" class="muted">—</span>
          </div>
          <div class="chat__actions">
            <button id="chat-info" class="icon-btn" type="button" title="Участники">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 16v-4" />
                <path d="M12 8h.01" />
              </svg>
            </button>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <div id="typing" class="typing" hidden>
          <span class="typing__dots"><i></i><i></i><i></i></span>
          <span id="typing-text">печатает…</span>
        </div>

        <footer class="composer">
          <button
            id="action-attach"
            class="icon-btn composer__attach"
            type="button"
            title="Прикрепить картинку"
          >
            <span aria-hidden="true">＋</span>
          </button>
          <input
            id="file-input"
            type="file"
            accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml"
            hidden
          />
          <textarea
            id="composer-input"
            class="composer__input"
            rows="1"
            maxlength="4000"
            placeholder="Сообщение…"
          ></textarea>
          <button id="composer-send" class="btn btn--primary composer__send" type="button" title="Отправить">
            <span aria-hidden="true">➤</span>
          </button>
        </footer>
      </section>

      <!-- Заглушка, когда чат не выбран -->
      <section id="empty" class="empty">
        <div class="empty__art" aria-hidden="true">✦</div>
        <h2>Выберите чат</h2>
        <p>Или начните новый диалог из списка контактов</p>
      </section>
    </main>

    <!-- Модальные окна -->
    <div id="modal-root" class="modal-root" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="/vendor/socket.io.min.js"></script>
    <script src="/config.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
